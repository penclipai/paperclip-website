server {
    listen 80;
    listen [::]:80;
    server_name penclipai.com penclip.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name penclipai.com penclip.cn;

    ssl_certificate /etc/letsencrypt/live/paperclipai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperclipai.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/penclip-website/current-cn;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
